      </div>
    </aside>

    // Helpers

    function renderProfList(filter = ''){
      profListEl.innerHTML = '';
      const q = filter.trim().toLowerCase();
      profesores.filter(p => p.nombre.toLowerCase().includes(q) || p.especialidad.toLowerCase().includes(q))
        .forEach(p => {
          const btn = document.createElement('button');
          btn.className = 'w-full text-left p-2 rounded hover:bg-gray-50 flex items-center gap-3';
          btn.innerHTML = `<div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center">${p.nombre.split(' ').map(n=>n[0]).slice(0,2).join('')}</div>
                           <div class="flex-1">
                             <div class="font-medium">${p.nombre}</div>
                             <div class="text-xs text-gray-500">${p.especialidad}</div>
                           </div>`;
          btn.addEventListener('click', ()=> showProfesor(p.id));
          profListEl.appendChild(btn);
      });
    }

    function showProfesor(profesorId){
      const prof = profesores.find(x => x.id === profesorId);
      if(!prof) return;

      const profMaterias = materias.filter(m => m.profesorId === profesorId);
      const profGrupos = grupos.filter(g => g.profesorId === profesorId);

      profDetailEl.innerHTML = '';

      // Card: información básica
      const infoCard = document.createElement('article');
      infoCard.className = 'bg-white p-4 rounded shadow';
      infoCard.innerHTML = `
        <h3 class="text-xl font-semibold mb-2">${prof.nombre}</h3>
        <p class="text-sm text-gray-600 mb-4">Especialidad: <strong>${prof.especialidad}</strong></p>
        <p class="text-sm text-gray-700">Materias a cargo: <strong>${profMaterias.length}</strong></p>
        <p class="text-sm text-gray-700">Grupos: <strong>${profGrupos.length}</strong></p>
      `;

      // Card: materias
      const matCard = document.createElement('section');
      matCard.className = 'bg-white p-4 rounded shadow';
      matCard.innerHTML = <h4 class="font-semibold mb-2">Materias</h4>;
      const matList = document.createElement('div');
      matList.className = 'space-y-2';

      profMaterias.forEach(m => {
        const hid = materiaHorario.get(m.id);
        const h = horarios.find(hh => hh.id === hid);
        matList.innerHTML += `
          <div class="p-2 border rounded">
            <div class="font-medium">${m.nombre} <span class="text-xs text-gray-500">(${m.codigo})</span></div>
            <div class="text-xs text-gray-600">Horario: ${h ? ${h.dia} ${h.inicio} - ${h.fin} : '—'}</div>
          </div>
        `;
      });

      grpCard.innerHTML = <h4 class="font-semibold mb-2">Grupos</h4>;

      grpList.className = 'flex flex-wrap gap-2';
      profGrupos.forEach(g => {
        const chip = document.createElement('div');
        chip.className = 'px-3 py-1 border rounded text-sm';
        chip.textContent = g.nombre;
        grpList.appendChild(chip);
