<h1>Gestión de Profesores</h1>
<ul>
    <li><a href="{% url 'agregar_profesor' %}"><button>Agregar Profesor</button></a></li>
    <li><a href="{% url 'buscar_profesor' %}"><button>Buscar Profesor</button></a></li>
</ul>

<h2>Lista de Profesores</h2>
<table border="1">
    <tr><th>ID</th><th>Nombre</th><th>Especialidad</th><th>Acciones</th></tr>
    {% for p in profesores %}
    <tr>
        <td>{{ p.0 }}</td>
        <td>{{ p.1 }}</td>
        <td>{{ p.2 }}</td>
        <td>
            <a href="{% url 'editar_profesor' p.0 %}">Editar</a> |
            <a href="{% url 'eliminar_profesor' p.0 %}">Eliminar</a>
        </td>
    </tr>
    {% endfor %}
</table>
<a href="{% url 'logout' %}">
    <button type="button">Cerrar Sesión</button>
</a>
